; Local development OPcache tuning.
;
; The application code is bind-mounted from Windows (C:\...) into the Linux
; container. stat() calls on that filesystem are very slow, and the default
; `opcache.revalidate_freq=2` makes PHP re-check thousands of files every
; 2 seconds, causing multi-second request times.
;
; Re-check less often and give OPcache more room. If you edit backend PHP code
; and do not want to wait, restart the app container:
;   docker compose restart app
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=60
