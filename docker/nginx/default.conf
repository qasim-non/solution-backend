# Redirect all HTTP traffic to HTTPS (Only used if handled by an external proxy/cloud provider)
# If your cloud provider terminates SSL automatically, you only need the port 80 block below!

server {
    listen 80;
    server_name localhost;

    # Re-resolve the app container through Docker's embedded DNS. Without this
    # nginx caches the IP at startup and returns 502 after `app` is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Frontend: Serve React static files built into Nginx
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend: Route /api and /sanctum requests to Laravel PHP-FPM
    location ~ ^/(api|sanctum) {
        root /var/www/html/public;
        set $backend app:9000;
        fastcgi_pass $backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # Prevent access to hidden files
    location ~ /\.ht {
        deny all;
    }
}
